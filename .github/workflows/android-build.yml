name: Empire Rush Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android-debug:
    name: Build Android APK
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout Empire Rush
        uses: actions/checkout@v4

      - name: Configure Godot Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          export HOME=/github/home
          mkdir -p "$HOME/.local/share/godot/export_templates"
          TEMPLATE_ROOT=""
          for candidate in \
            /root/.local/share/godot/export_templates/4.3.stable \
            /root/.local/share/godot/export_templates/4.3.stable.mono \
            /usr/local/share/godot/export_templates/4.3.stable \
            /usr/share/godot/export_templates/4.3.stable; do
            if [ -d "$candidate" ]; then
              TEMPLATE_ROOT="$candidate"
              break
            fi
          done
          if [ -z "$TEMPLATE_ROOT" ]; then
            echo "Godot 4.3 export templates were not found."
            find /root /usr/local /usr/share -path '*export_templates*' -maxdepth 8 -type f 2>/dev/null | head -50 || true
            exit 1
          fi
          cp -a "$TEMPLATE_ROOT" "$HOME/.local/share/godot/export_templates/"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android sdkmanager was not found."
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          # Godot 4.3's Android export expects the SDK 34 toolchain.
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -d "$ANDROID_HOME/platforms/android-34"
          test -x "$ANDROID_HOME/build-tools/34.0.0/aapt2"
          JAVA_BIN="$(command -v java)"
          JAVA_HOME_DETECTED="$(dirname "$(dirname "$(readlink -f "$JAVA_BIN")")")"
          echo "JAVA_HOME=$JAVA_HOME_DETECTED" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          java -version
          "$ANDROID_HOME/platform-tools/adb" version
          "$ANDROID_HOME/build-tools/34.0.0/aapt2" version

      - name: Create Android debug keystore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/keys
          rm -f build/keys/debug.keystore
          keytool -genkeypair \
            -keystore build/keys/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 9999 \
            -dname "CN=Android Debug,O=Android,C=US" \
            -deststoretype pkcs12
          test -s build/keys/debug.keystore
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$GITHUB_WORKSPACE/build/keys/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Validate standalone Godot project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .godot
          godot --headless --path . --editor --quit --display-driver headless

      - name: Export Android APK
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/android
          mkdir -p build/android
          godot --headless --path . --verbose --export-debug "Empire Rush Android" "build/android/empire-rush-debug.apk"
          test -s build/android/empire-rush-debug.apk
          ls -lh build/android/empire-rush-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: empire-rush-debug-apk
          path: build/android/empire-rush-debug.apk
          if-no-files-found: error
          retention-days: 14

# SDK 34 + generated debug keystore for Godot 4.3 Android export.
