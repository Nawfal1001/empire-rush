name: Empire Rush Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  UPSTREAM_REPO: "https://github.com/Gamowy/Civ2025.git"
  ADMOB_PLUGIN_REPO: "https://github.com/poingstudios/godot-admob-plugin.git"
  ADMOB_PLUGIN_TAG: "v4.3.1"

jobs:
  android-debug:
    name: Build Android APK
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout Empire Rush
        uses: actions/checkout@v4

      - name: Prepare game and AdMob plugin
        shell: bash
        run: |
          set -euo pipefail
          rm -rf game-src admob-src
          git clone --depth 1 "$UPSTREAM_REPO" game-src
          git clone --depth 1 --branch "$ADMOB_PLUGIN_TAG" "$ADMOB_PLUGIN_REPO" admob-src

          cp game-src/LICENSE ./CIV2025-MIT-LICENSE.txt
          cp game-src/ASSETS.md ./CIV2025-ASSETS.md
          mkdir -p game-src/game
          cp game/EmpireRush.gd game-src/game/EmpireRush.gd
          cp game/EmpireRush.tscn game-src/game/EmpireRush.tscn
          cp game/Monetization.gd game-src/game/Monetization.gd

          mkdir -p game-src/addons
          cp -a admob-src/platforms/godot_editor/addons/admob game-src/addons/admob

          sed -i 's/name="Civ2025"/name="Empire Rush"/' game-src/project.godot
          sed -i 's/description="Mobile strategy game for Android."/description="Offline-first fast strategy game for Android."/' game-src/project.godot
          sed -i 's#run/main_scene="[^"]*"#run/main_scene="res://game/EmpireRush.tscn"#' game-src/project.godot
          sed -i 's/package\/unique_name="com.example.civ2025"/package\/unique_name="com.nawfal.empirerush"/' game-src/export_presets.cfg
          sed -i 's/package\/name="Civ2025"/package\/name="Empire Rush"/' game-src/export_presets.cfg
          printf '\n[editor_plugins]\nenabled=PackedStringArray("res://addons/admob/plugin.cfg")\n' >> game-src/project.godot
          rm -rf game-src/.godot

      - name: Configure Godot Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          export HOME=/github/home
          mkdir -p "$HOME/.local/share/godot/export_templates"
          TEMPLATE_ROOT=""
          for candidate in \
            /root/.local/share/godot/export_templates/4.3.stable \
            /root/.local/share/godot/export_templates/4.3.stable.mono \
            /usr/local/share/godot/export_templates/4.3.stable \
            /usr/share/godot/export_templates/4.3.stable; do
            if [ -d "$candidate" ]; then
              TEMPLATE_ROOT="$candidate"
              break
            fi
          done
          if [ -z "$TEMPLATE_ROOT" ]; then
            echo "Godot 4.3 export templates were not found in the CI image."
            find /root /usr/local /usr/share -path '*export_templates*' -maxdepth 8 -type f 2>/dev/null | head -50 || true
            exit 1
          fi
          cp -a "$TEMPLATE_ROOT" "$HOME/.local/share/godot/export_templates/"
          JAVA_BIN="$(command -v java)"
          JAVA_HOME_DETECTED="$(dirname "$(dirname "$(readlink -f "$JAVA_BIN")")")"
          echo "JAVA_HOME=$JAVA_HOME_DETECTED" >> "$GITHUB_ENV"
          java -version

      - name: Validate Godot project and let AdMob fetch Android dependency
        shell: bash
        run: |
          set -euo pipefail
          cd game-src
          godot --headless --editor --quit

      - name: Export APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/android
          cd game-src
          godot --headless --verbose --export-debug "Civ2025 Android" "../build/android/empire-rush-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: empire-rush-debug-apk
          path: game-src/build/android/empire-rush-debug.apk
          if-no-files-found: error
          retention-days: 14
